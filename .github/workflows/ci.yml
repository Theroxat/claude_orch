name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Everything runs through ./dev, which only calls `docker compose` (no host node/pnpm).
      - name: Install dependencies
        run: ./dev install
      - name: Lint
        run: ./dev lint
      - name: Typecheck
        run: ./dev typecheck
      - name: Test
        run: ./dev test
      - name: Installer tests (shellcheck + bats)
        run: ./dev test:install

  images:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate the production compose file
        run: |
          cp deploy/server/.env.example deploy/server/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder/; s/^ORCH_ENCRYPTION_KEY=$/ORCH_ENCRYPTION_KEY=ci-placeholder/' deploy/server/.env
          docker compose -f deploy/server/compose.yaml config --quiet
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: false
          load: true
          tags: orch-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max
      - name: Agent image smoke test (Claude binary and orch CLI)
        run: |
          docker run --rm --entrypoint sh orch-agent:ci -c \
            'test -x "$ORCH_CLAUDE_BIN" && "$ORCH_CLAUDE_BIN" --version && "$ORCH_CLAUDE_BIN" setup-token --help >/dev/null && command -v script && orch help >/dev/null'

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source . --redact --verbose --no-banner
