name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run; every commit on main keeps its full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck, test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Everything runs through ./dev, which only calls `docker compose` (no host node/pnpm).
      # CI installs with the frozen lockfile: a lockfile out of sync with package.json fails here.
      - name: Install dependencies
        run: ./dev build-tools && ./dev pnpm install --frozen-lockfile
      - name: Lint
        run: ./dev lint
      - name: Typecheck
        run: ./dev typecheck
      - name: Test
        run: ./dev test
      - name: Installer tests (shellcheck + bats)
        run: ./dev test:install

  ui:
    name: Browser UI tests (Playwright, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Self-contained: builds the web app, starts the e2e stack behind the production Caddy CSP,
      # runs Playwright (pinned image), tears everything down. CSP violations and axe
      # serious/critical findings fail the job.
      - name: UI tests
        run: ./dev test:ui
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-output
          path: |
            ~/.cache/orch-uitest/shots
            ~/.cache/orch-uitest/work/report.json
            ~/.cache/orch-uitest/work/findings.jsonl
            ~/.cache/orch-uitest/work/test-results
          if-no-files-found: ignore
          # The output lives under ~/.cache: without this, upload-artifact skips it as hidden.
          include-hidden-files: true
          retention-days: 7

  images:
    # One job per image so the three builds run in parallel instead of one after the other.
    name: Production image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: docker/server.Dockerfile
          - image: web
            file: docker/web.Dockerfile
          - image: agent
            file: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate the production compose file
        if: matrix.image == 'server'
        run: |
          cp deploy/server/.env.example deploy/server/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder/; s/^ORCH_ENCRYPTION_KEY=$/ORCH_ENCRYPTION_KEY=ci-placeholder/' deploy/server/.env
          docker compose -f deploy/server/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          # The agent and server images are loaded into the local daemon, for the smoke tests below.
          load: ${{ matrix.image == 'agent' || matrix.image == 'server' }}
          tags: orch-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Agent image smoke test (Claude binary and orch CLI)
        if: matrix.image == 'agent'
        run: |
          docker run --rm --entrypoint sh orch-agent:ci -c \
            'test -x "$ORCH_CLAUDE_BIN" && "$ORCH_CLAUDE_BIN" --version && "$ORCH_CLAUDE_BIN" setup-token --help >/dev/null && command -v script && orch help >/dev/null'
      - name: Server image smoke test (node ABI, ICU, CA certificates, crypto, tsx, Prisma CLI)
        if: matrix.image == 'server'
        run: |
          # The node binary is copied from node:*-alpine onto a plain alpine: fail fast if their
          # musl/libstdc++ ever drift apart (a missing shared library shows up as "not found").
          docker run --rm --entrypoint sh orch-server:ci -c '! ldd /usr/local/bin/node | grep -i "not found" && tsx --version >/dev/null && prisma --version >/dev/null && test "$(id -u)" != 0'
          docker run --rm --entrypoint node orch-server:ci -e "
            const c = require('crypto');
            const k = c.randomBytes(32), iv = c.randomBytes(12);
            const e = c.createCipheriv('aes-256-gcm', k, iv); const ct = Buffer.concat([e.update('x'), e.final()]);
            const d = c.createDecipheriv('aes-256-gcm', k, iv); d.setAuthTag(e.getAuthTag());
            if (Buffer.concat([d.update(ct), d.final()]).toString() !== 'x') process.exit(1);
            if (new Intl.DateTimeFormat('fr-FR', { dateStyle: 'full', timeZone: 'Europe/Paris' }).format(new Date(0)) !== 'jeudi 1 janvier 1970') process.exit(1);
            fetch('https://api.github.com/zen').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(e => { console.error(e); process.exit(1); });
          "

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source . --redact --verbose --no-banner

  docs:
    name: Documentation build (Sphinx, warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W -b html docs docs/_build/html
