name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a PR run; every commit on main keeps its full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, typecheck, test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Everything runs through ./dev, which only calls `docker compose` (no host node/pnpm).
      # CI installs with the frozen lockfile: a lockfile out of sync with package.json fails here.
      - name: Install dependencies
        run: ./dev build-tools && ./dev pnpm install --frozen-lockfile
      - name: Lint
        run: ./dev lint
      - name: Typecheck
        run: ./dev typecheck
      - name: Test
        run: ./dev test
      - name: Installer tests (shellcheck + bats)
        run: ./dev test:install

  ui:
    name: Browser UI tests (Playwright, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Self-contained: builds the web app, starts the e2e stack behind the production Caddy CSP,
      # runs Playwright (pinned image), tears everything down. CSP violations and axe
      # serious/critical findings fail the job.
      - name: UI tests
        run: ./dev test:ui
      - name: Upload screenshots and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-output
          path: |
            ~/.cache/orch-uitest/shots
            ~/.cache/orch-uitest/work/report-*.json
            ~/.cache/orch-uitest/work/findings.jsonl
            ~/.cache/orch-uitest/work/test-results
          if-no-files-found: ignore
          # The output lives under ~/.cache: without this, upload-artifact skips it as hidden.
          include-hidden-files: true
          retention-days: 7

  images:
    # One job per image so the three builds run in parallel instead of one after the other.
    name: Production image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            file: docker/server.Dockerfile
          - image: web
            file: docker/web.Dockerfile
          - image: agent
            file: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate the production compose file
        if: matrix.image == 'server'
        run: |
          cp deploy/server/.env.example deploy/server/.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder/; s/^ORCH_ENCRYPTION_KEY=$/ORCH_ENCRYPTION_KEY=ci-placeholder/' deploy/server/.env
          docker compose -f deploy/server/compose.yaml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          # Only the agent image is loaded into the local daemon, for the smoke test below.
          load: ${{ matrix.image == 'agent' }}
          tags: orch-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Agent image smoke test (Claude binary and orch CLI)
        if: matrix.image == 'agent'
        run: |
          docker run --rm --entrypoint sh orch-agent:ci -c \
            'test -x "$ORCH_CLAUDE_BIN" && "$ORCH_CLAUDE_BIN" --version && "$ORCH_CLAUDE_BIN" setup-token --help >/dev/null && command -v script && orch help >/dev/null'

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source . --redact --verbose --no-banner

  docs:
    name: Documentation build (Sphinx, warnings are errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W -b html docs docs/_build/html
