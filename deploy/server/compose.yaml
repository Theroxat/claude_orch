# orch production stack: Caddy (HTTPS + static web), server, Postgres, scheduled backups.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d     # pulls ghcr.io images; add --build to build from this checkout
#
# Only Caddy publishes host ports. Postgres and the server stay on the internal network.
#
# ORCH_TLS_MODE=acme (default): Caddy owns 80/443 and gets a Let's Encrypt certificate.
# ORCH_TLS_MODE=tunnel: behind Cloudflare Tunnel. Caddy serves plain HTTP only, on
#   ORCH_BIND_ADDR:HTTP_PORT; set HTTPS_PUBLISH=127.0.0.1: so nothing listens on 443
#   (the container port is never served in this mode). See .env.example.
name: orch

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: ghcr.io/theroxat/orch-web:${ORCH_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    ports:
      - '${ORCH_BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTPS_PUBLISH:-0.0.0.0:${HTTPS_PORT:-443}}:443'
    environment:
      ORCH_DOMAIN: ${ORCH_DOMAIN:?set ORCH_DOMAIN in .env (e.g. orch.selfhostr.io)}
    volumes:
      # ORCH_TLS_MODE picks Caddyfile.acme or Caddyfile.tunnel; both import routes.caddy.
      - ./Caddyfile.${ORCH_TLS_MODE:-acme}:/etc/caddy/Caddyfile:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Caddy admin API, loopback only inside the container.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 5

  server:
    <<: *restart
    image: ghcr.io/theroxat/orch-server:${ORCH_VERSION:-latest}
    build:
      context: ../..
      dockerfile: docker/server.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORCH_BASE_URL: ${ORCH_BASE_URL:-https://${ORCH_DOMAIN}}
      # Wins over ORCH_BASE_URL. Required in practice behind Cloudflare Tunnel.
      ORCH_PUBLIC_URL: ${ORCH_PUBLIC_URL:-}
      # Peers allowed to set X-Forwarded-*: the Caddy container (private Docker network) only.
      ORCH_TRUST_PROXY: ${ORCH_TRUST_PROXY:-loopback,linklocal,uniquelocal}
      DATABASE_URL: postgresql://${POSTGRES_USER:-orch}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-orch}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/orch-secrets/github-app.pem
      ORCH_ALLOWED_GITHUB_LOGINS: ${ORCH_ALLOWED_GITHUB_LOGINS:-}
      ORCH_ALLOWED_GITHUB_ORGS: ${ORCH_ALLOWED_GITHUB_ORGS:-}
      ORCH_ACCESS_GRACE_SEC: ${ORCH_ACCESS_GRACE_SEC:-900}
      ORCH_ALLOW_ANY_GITHUB_USER: ${ORCH_ALLOW_ANY_GITHUB_USER:-false}
      ORCH_ADMIN_GITHUB_LOGINS: ${ORCH_ADMIN_GITHUB_LOGINS:-}
      # Observability, off by default (see docs/observability.md and deploy/observability).
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ORCH_ENCRYPTION_KEY: ${ORCH_ENCRYPTION_KEY:?set ORCH_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
    volumes:
      # GitHub App private key (read-only). See README: Creating the GitHub App.
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-./secrets/github-app.pem}:/run/orch-secrets/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *restart
    # Keep POSTGRES_MAJOR equal to the major of an existing data volume (the backup image uses it).
    image: postgres:${POSTGRES_MAJOR:-16}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-orch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Scheduled pg_dump (custom format, compressed) into the `backups` volume with daily/weekly/
  # monthly rotation. Optional: age encryption (BACKUP_AGE_RECIPIENT), S3 upload (BACKUP_S3_*).
  # To switch it off: `docker compose stop backup` (or `docker compose up -d --scale backup=0`).
  # Runs as the unprivileged `postgres` user (uid 70) with a read-only root filesystem.
  backup:
    <<: *restart
    image: orch-backup:${ORCH_VERSION:-latest}
    build:
      context: ./backup
      args:
        PG_MAJOR: ${POSTGRES_MAJOR:-16}
    environment:
      PGUSER: ${POSTGRES_USER:-orch}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-orch}
      # BACKUP_HOUR_UTC is the former setting; BACKUP_SCHEDULE wins when both are set.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 ${BACKUP_HOUR_UTC:-3} * * *}
      # BACKUP_RETENTION_DAYS is the former setting for BACKUP_KEEP_DAILY.
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-${BACKUP_RETENTION_DAYS:-7}}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-orch}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PRUNE: ${BACKUP_S3_PRUNE:-false}
    volumes:
      # A named volume (default) or a host directory (BACKUP_VOLUME=/srv/orch-backups).
      - ${BACKUP_VOLUME:-backups}:/backups
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Only for the entrypoint: chown an older root-owned volume, then su-exec to uid 70.
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Fails when the last successful backup is older than twice the schedule interval.
      test: ['CMD', 'su-exec', 'postgres', '/usr/local/bin/orch-backup-healthcheck']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
