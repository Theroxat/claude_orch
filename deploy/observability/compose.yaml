# Optional observability stack: Prometheus + Grafana with a provisioned orch dashboard.
# Layered on top of the production stack (run from deploy/server):
#
#   docker compose -f compose.yaml -f ../observability/compose.yaml up -d
#
# It turns METRICS_ENABLED on for the server and scrapes http://server:3000/metrics on the
# internal Docker network. Caddy keeps answering 404 on /metrics, so nothing is public.
# Grafana listens on 127.0.0.1:GRAFANA_PORT only (reach it with an SSH tunnel or your own proxy).
#
# Set GRAFANA_ADMIN_PASSWORD in .env. METRICS_TOKEN (optional) is used by both sides.
services:
  server:
    environment:
      METRICS_ENABLED: 'true'

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/prometheus-entrypoint.sh']
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-entrypoint.sh:/prometheus-entrypoint.sh:ro
      - prometheus_data:/prometheus
    depends_on:
      server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
