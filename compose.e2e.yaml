# Real end-to-end test stack (./dev e2e). Separate project: docker compose -p orch-e2e.
#
# Real code paths: the server talks to a fake GitHub (test/e2e/fake-github: REST API + git smart
# HTTP) through GITHUB_API_URL / GITHUB_WEB_URL, and two real agents ("alice", "bob") drive the
# REAL host Docker daemon: task images are built, task containers started, `docker cp`/`exec`
# run, branches are pushed to the fake git server. Only Claude is faked (test/e2e/fake-claude).
#
# Every secret (webhook secret, OAuth client secret, encryption key, App private key) is
# generated at test time by ./dev e2e or the keygen container (tmp volume). Nothing is real.
# The stack publishes no host ports.
name: orch-e2e

x-agent: &agent
  build:
    context: .
    dockerfile: apps/agent/Dockerfile
  image: orch-agent:e2e
  profiles: ['agents']
  restart: 'no'
  depends_on:
    server:
      condition: service_healthy
    fake-github:
      condition: service_healthy

services:
  keygen:
    image: orch-e2e-fake-github:e2e
    build:
      context: test/e2e
      dockerfile: fake-github/Dockerfile
    # Throwaway GitHub App key, only in the e2e-keys volume (deleted with `down -v`).
    entrypoint: ['sh', '-c']
    command:
      - '[ -s /keys/app.pem ] || openssl genrsa -out /keys/app.pem 2048 2>/dev/null; chmod 0644 /keys/app.pem'
    volumes:
      - e2e-keys:/keys

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: e2e-only
      POSTGRES_DB: orch
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orch -d orch']
      interval: 2s
      timeout: 3s
      retries: 30

  fake-github:
    image: orch-e2e-fake-github:e2e
    environment:
      PORT: '8080'
      FAKE_GH_APP_ID: '1001'
      FAKE_GH_PRIVATE_KEY_PATH: /keys/app.pem
      FAKE_GH_PUBLIC_URL: http://fake-github:8080
      FAKE_GH_WEBHOOK_URL: http://server:3000/api/github/webhook
      FAKE_GH_WEBHOOK_SECRET: ${ORCH_E2E_WEBHOOK_SECRET:?generated by ./dev e2e}
      FAKE_GH_CLIENT_ID: Iv1.orche2e
      FAKE_GH_CLIENT_SECRET: ${ORCH_E2E_CLIENT_SECRET:?generated by ./dev e2e}
    volumes:
      - e2e-keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: orch-tools:dev
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - e2e-keys:/keys:ro
    command:
      - sh
      - -c
      - pnpm --filter @orch/server exec prisma migrate deploy && cd apps/server && exec node --import tsx src/main.ts
    environment:
      NODE_ENV: production
      ORCH_ALLOW_ANY_GITHUB_USER: 'true' # E2E signs in fake users
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORCH_BASE_URL: http://server:3000
      DATABASE_URL: postgresql://orch:e2e-only@postgres:5432/orch
      GITHUB_API_URL: http://fake-github:8080
      GITHUB_WEB_URL: http://fake-github:8080
      GITHUB_APP_ID: '1001'
      GITHUB_APP_SLUG: orch-e2e
      GITHUB_APP_PRIVATE_KEY_PATH: /keys/app.pem
      GITHUB_CLIENT_ID: Iv1.orche2e
      GITHUB_CLIENT_SECRET: ${ORCH_E2E_CLIENT_SECRET:?generated by ./dev e2e}
      GITHUB_WEBHOOK_SECRET: ${ORCH_E2E_WEBHOOK_SECRET:?generated by ./dev e2e}
      ORCH_ENCRYPTION_KEY: ${ORCH_E2E_ENCRYPTION_KEY:?generated by ./dev e2e}
      DISPATCHER_INTERVAL_MS: '1000'
      AGENT_SWEEP_INTERVAL_MS: '1000'
      AUTO_OFFER_TTL_SEC: '60'
    depends_on:
      postgres:
        condition: service_healthy
      fake-github:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  # Two member machines. They share the host Docker daemon (real socket) but have separate data,
  # secrets and work dirs. The work dir is bind-mounted at the SAME absolute path (PLAN 5.1).
  # The runner starts them once it has their enrollment tokens.
  alice:
    <<: *agent
    environment:
      ORCH_SERVER_URL: http://server:3000
      ORCH_ENROLL_TOKEN: ${ORCH_E2E_ENROLL_TOKEN_ALICE:-}
      ORCH_MACHINE_NAME: alice-laptop
      ORCH_PLAN: max20
      ORCH_USAGE_INTERVAL_SEC: '5'
      ORCH_WORK_DIR: ${ORCH_E2E_WORK_ALICE:?}
      ORCH_CLAUDE_BIN: /opt/e2e/claude
      ORCH_GIT_BASE_URL: http://fake-github:8080
      ORCH_DEFAULT_IMAGE: debian:bookworm-slim
      LOG_LEVEL: debug
    volumes:
      - alice-data:/data
      - alice-secrets:/secrets
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ORCH_E2E_WORK_ALICE:?}:${ORCH_E2E_WORK_ALICE:?}
      - ./test/e2e/fake-claude/claude:/opt/e2e/claude:ro

  bob:
    <<: *agent
    environment:
      ORCH_SERVER_URL: http://server:3000
      ORCH_ENROLL_TOKEN: ${ORCH_E2E_ENROLL_TOKEN_BOB:-}
      ORCH_MACHINE_NAME: bob-desktop
      ORCH_PLAN: max20
      ORCH_USAGE_INTERVAL_SEC: '5'
      ORCH_WORK_DIR: ${ORCH_E2E_WORK_BOB:?}
      ORCH_CLAUDE_BIN: /opt/e2e/claude
      ORCH_GIT_BASE_URL: http://fake-github:8080
      ORCH_DEFAULT_IMAGE: debian:bookworm-slim
      LOG_LEVEL: debug
    volumes:
      - bob-data:/data
      - bob-secrets:/secrets
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ORCH_E2E_WORK_BOB:?}:${ORCH_E2E_WORK_BOB:?}
      - ./test/e2e/fake-claude/claude:/opt/e2e/claude:ro

  # Drives the scenario: REST API, webhooks (via the fake GitHub), and the agents' CLI through
  # `docker compose exec <agent> orch ...`. It needs the compose file at the same host path.
  runner:
    build:
      context: test/e2e/runner
    image: orch-e2e-runner:e2e
    profiles: ['runner']
    working_dir: ${ORCH_E2E_REPO:?}
    environment:
      ORCH_E2E_REPO: ${ORCH_E2E_REPO:?}
      ORCH_E2E_WORK_ALICE: ${ORCH_E2E_WORK_ALICE:?}
      ORCH_E2E_WORK_BOB: ${ORCH_E2E_WORK_BOB:?}
      ORCH_E2E_WORK: ${ORCH_E2E_WORK:?}
      ORCH_E2E_IDS_FILE: ${ORCH_E2E_WORK:?}/assignments.txt
      ORCH_E2E_WEBHOOK_SECRET: ${ORCH_E2E_WEBHOOK_SECRET:?}
      ORCH_E2E_CLIENT_SECRET: ${ORCH_E2E_CLIENT_SECRET:?}
      ORCH_E2E_ENCRYPTION_KEY: ${ORCH_E2E_ENCRYPTION_KEY:?}
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      SERVER_URL: http://server:3000
      FAKE_GH_URL: http://fake-github:8080
    volumes:
      - ${ORCH_E2E_REPO:?}:${ORCH_E2E_REPO:?}:ro
      - ${ORCH_E2E_WORK:?}:${ORCH_E2E_WORK:?}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      server:
        condition: service_healthy

volumes:
  e2e-keys:
  alice-data:
  alice-secrets:
  bob-data:
  bob-secrets:
