<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e3e8e1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f171b" media="(prefers-color-scheme: dark)" />
    <title>orch is unreachable</title>
    <style>
      :root {
        color-scheme: light dark;
        --panel: #e3e8e1;
        --surface: #f7f9f5;
        --ink: #142029;
        --muted: #59685f;
        --rule: #cad3c9;
        --proceed: #d97757;
        --on-proceed: #2b1208;
        --caution: #cfa500;
        --lift: 0 1px 0 rgb(20 32 41 / 0.04), 0 18px 40px -18px rgb(20 32 41 / 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --panel: #0f171b;
          --surface: #162126;
          --ink: #e3eae2;
          --muted: #8fa199;
          --rule: #26353b;
          --caution: #f0cc3c;
          --lift: 0 1px 0 rgb(0 0 0 / 0.2), 0 22px 48px -18px rgb(0 0 0 / 0.7);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--panel);
        color: var(--ink);
        font-family:
          'Overpass Variable',
          'Overpass',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
      }
      main {
        width: min(100%, 26rem);
        padding: 28px 28px 26px;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--lift);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        font-weight: 850;
        font-size: 1.35rem;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .brand svg {
        width: 34px;
        height: 22px;
      }
      .track {
        fill: none;
        stroke: var(--ink);
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      .signal {
        fill: var(--caution);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.4rem;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 9px 16px 8px;
        border-radius: 9px;
        background: var(--proceed);
        color: var(--on-proceed);
        font-weight: 750;
        text-decoration: none;
      }
      a:hover {
        filter: brightness(1.06);
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg viewBox="0 0 34 22" aria-hidden="true" focusable="false">
          <path class="track" d="M2 4c9 0 11 7 20 7M2 18c9 0 11-7 20-7M2 11h22" />
          <circle class="signal" cx="28.5" cy="11" r="3.5" />
        </svg>
        orch
      </div>
      <h1>Server unreachable</h1>
      <p>
        orch cannot reach its server. Check your connection or that the server is running, then try
        again.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
